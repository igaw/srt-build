kernel_config:
  nobase: ['']
  "": ['config-base', 'config-no-rt-group-sched']
  sle: ['config-sle', 'config-no-rt-group-sched']
  slert:
    - config-sle
    - config-base-rt
    - config-rcu
    - rt/config-rt-trace
    - config-cpufreq-fixed
    - config-no-rt-group-sched
  rt:
    - config-base-rt
    - config-rcu
    - rt/config-rt-trace
    - config-cpufreq-fixed
    - config-no-rt-group-sched
  rtb:
    - config-base-rt
    - config-rcu
    - rt/config-rtb
    - config-cpufreq-fixed
    - config-no-rt-group-sched
  up: ['rt/config-up', 'config-cpufreq-fixed', 'config-no-rt-group-sched']
  vp: ['rt/config-vp', 'config-cpufreq-fixed', 'config-no-rt-group-sched']
  ll: ['rt/config-ll', 'config-cpufreq-fixed', 'config-no-rt-group-sched']
  nohz: ['rt/config-nohz', 'config-cpufreq-fixed', 'config-no-rt-group-sched']
  none: ['rt/config-none', 'config-cpufreq-fixed', 'config-no-rt-group-sched']
  lazy: ['rt/config-lazy', 'config-cpufreq-fixed', 'config-no-rt-group-sched']
  blktests: ['config-blktests', 'config-no-rt-group-sched']
  nvme: ['config-nvme', 'config-no-rt-group-sched']

# Flavors with something besides config fragments:
#   kernel: boot this flavor's kernel instead of building one
#   kernel_args: added to the kernel command line; {isolcpus} and
#     {housekeeping} are the board's isolcpus and housekeeping_cpus.
#     Left out on boards without isolcpus.
#   needs_isolcpus: skip the flavor on boards without isolcpus
#   fair_server_off: {kernel release (git describe prefix): [tests]}:
#     those tests' jobs switch the fair server off before testing
# A board's kernel_args: {flavor: args} adds board specific arguments.
flavors:
  # 6.12's fair server (dl_server) runs normal tasks ahead of RT tasks
  # when it thinks they starve. Its period (1 s) and the tests' cycles
  # line up differently in each run, so in some runs it takes over:
  # rtla-osnoise on the Pis saw hackbench run 0.2-2.4 ms ahead of the
  # FIFO osnoise thread in some jobs and not at all in others (round 8,
  # traced in hack job 562). On rpi3-64 (hack job 561) 1 of 4 runs with
  # it hit 4 ms, none of 4 without. That is no baseline. Only osnoise
  # keeps its RT thread busy long enough (80 %) to starve normal tasks;
  # the other tests' RT threads mostly sleep, and they measured the same
  # with and without it (rounds 8 and 9). So off only for rt
  # rtla-osnoise on 6.12; everything else, rt-isolcpus included, tests
  # the kernel as it is (pi-stress even needs it, round 9). Switching
  # it off logs "Fair server disabled in CPU N, system may crash due to
  # starvation": expected.
  rt:
    fair_server_off:
      "v6.12.": [rtla-osnoise]
    # The default round: all tests in one boot, in this order (lava
    # --split: one boot per test). rtla first and for 5 minutes, the
    # rt-tests for 1, timerlat under the fixed stress mix last.
    # pi-stress keeps a boot of its own: it needs rcutree.kthread_prio
    # and takes the board down when it goes wrong (round 9).
    combined:
      - settle
      - rtla-timerlat: 5m
      - rtla-osnoise: 5m
      - cyclictest
      - cyclicdeadline
      - pmqtest
      - ptsematest
      - svsematest
      - sigwaittest
      - signaltest
      - rt-migrate-test
      - rtla-timerlat-stress: 5m
  # rt tuned for isolated CPUs: the rt kernel, CPU 0 for housekeeping,
  # the others without tick, RCU callbacks, unmanaged IRQs and other
  # tasks. Without "domain" the scheduler still puts normal tasks
  # (systemd, the test scripts) on the isolated CPUs, and 6.12's fair
  # server runs them ahead of the measuring RT threads (rpi3-64:
  # cyclictest hits of 0.5-1.2 ms).
  rt-isolcpus:
    kernel: rt
    needs_isolcpus: true
    kernel_args: >-
      nohz_full={isolcpus} rcu_nocbs={isolcpus} irqaffinity={housekeeping}
      isolcpus=domain,managed_irq,{isolcpus} skew_tick=1
    combined:
      - isolcpus rt-isolcpus
      - settle
      - rtla-timerlat rt-isolcpus: 5m
      - rtla-osnoise rt-isolcpus: 5m
      - cyclictest rt-isolcpus
  # Full dynticks needs nohz_full=; the kernel alone only stops the tick
  # on idle CPUs.
  nohz:
    kernel_args: nohz_full={isolcpus}

rt_suites:
  - '0_cyclicdeadline'
  - '0_cyclictest'
  - '0_pi-stress'
  - '0_pmqtest'
  - '0_ptsematest'
  - '0_rt-migrate-test'
  - '0_signaltest'
  - '0_sigwaittest'
  - '0_svsematest'
  - '0_rtla-osnoise'
  - '0_rtla-timelat'
  - '0_rtla-timerlat-stress'

suites:
  - '0_smoke-tests'

machine_config:
  bbb:
    hostname: bbb
    cmdline: "console=ttyO0,115200n8 root=/dev/nfs rw nfsroot=192.168.19.5:/{rootfs},nfsvers=4,tcp ip=dhcp earlyprintk printk.time=y mitigations=off systemd.log_color=0 TERM=dumb"
    rootfs: bbb
    image: arch/arm/boot/zImage
    target: zImage
    defconfig: omap2plus_defconfig
    config: bbb/config-min
    dtb: arch/arm/boot/dts/ti/omap/am335x-boneblack.dtb
    CROSS_COMPILE: arm-linux-gnu-
    ARCH: arm
    # Flavors this board can't build (see the configs/rt/config-* comments)
    skip_flavors: [lazy]
    install:
      default: "scp arch/arm/boot/zImage bbb:/tmp ; scp arch/arm/boot/dts/ti/omap/am335x-boneblack.dtb bbb:/tmp"
      lava: "scp arch/arm/boot/zImage root@lava:/srv/www/htdocs/artifacts/bbb/bbb-image{}; scp arch/arm/boot/dts/ti/omap/am335x-boneblack.dtb root@lava:/srv/www/htdocs/artifacts/bbb/"

  c2d:
    hostname: c2d
    cmdline: "console=ttyS0,115200n8 root=/dev/nfs rw nfsroot=192.168.60.5:/srv/nfs/{rootfs},nfsvers=3,tcp ip=dhcp earlyprintk printk.time=y oops=panic panic_on_warn mitigations=off systemd.log_color=0 TERM=dumb"
    rootfs: c2d
    image: arch/x86_64/boot/bzImage
    target: bzImage
    defconfig: x86_64_defconfig
    config: c2d/config-min
    CC: gcc
    housekeeping_cpus: "0"
    isolcpus: "1"
    kernel_args:
      # No deep C-states (acpi_idle; intel_idle doesn't know Core 2)
      rt-isolcpus: processor.max_cstate=1
    install:
      default: "scp arch/x86_64/boot/bzImage c2d:/tmp"
      lava: "scp arch/x86_64/boot/bzImage root@lava:/srv/www/htdocs/artifacts/c2d/c2d-image{}"

  rpi3-32:
    hostname: rpi3-32
    cmdline: "console=ttyO0,115200n8 root=/dev/nfs rw nfsroot=192.168.19.5:/{rootfs},nfsvers=4,tcp ip=dhcp earlyprintk printk.time=y mitigations=off systemd.log_color=0 TERM=dumb"
    rootfs: rpi3-32
    image: arch/arm/boot/zImage
    target: zImage
    defconfig: bcm2835_defconfig
    config: rpi3-32/config-min
    dtb: arch/arm/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb
    CROSS_COMPILE: arm-linux-gnu-
    ARCH: arm
    # Flavors this board can't build (see the configs/rt/config-* comments)
    skip_flavors: [lazy]
    housekeeping_cpus: "0"
    isolcpus: "1-3"
    install:
      default: "scp arch/arm/boot/zImage rpi3-32:/tmp ; scp arch/arm/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb rpi3-32:/tmp"
      tftp: "scp arch/arm/boot/zImage root@lava:/srv/tftp/rpi3-32-image ; scp arch/arm/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb lava:/srv/tftp"
      lava: "scp arch/arm/boot/zImage root@lava:/srv/www/htdocs/artifacts/rpi3-32/rpi3-32-image{} ; scp arch/arm/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb root@lava:/srv/www/htdocs/artifacts/rpi3-32"

  rpi3-64:
    hostname: rpi3-64
    cmdline: "console=ttyO0,115200n8 root=/dev/nfs rw nfsroot=192.168.19.5:/{rootfs},nfsvers=4,tcp ip=dhcp earlyprintk printk.time=y systemd.log_color=0 TERM=dumb"
    rootfs: rpi3-64
    image: arch/arm64/boot/Image
    target: Image
    defconfig: defconfig
    config: rpi3-64/config-min
    dtb: arch/arm64/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb
    CROSS_COMPILE: aarch64-linux-gnu-
    ARCH: arm64
    # Flavors this board can't build (see the configs/rt/config-* comments)
    skip_flavors: [up, lazy]
    housekeeping_cpus: "0"
    isolcpus: "1-3"
    install:
      default: "scp arch/arm64/boot/Image rpi3-64:/tmp ; scp arch/arm64/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb rpi3-64:/tmp"
      tftp: "scp arch/arm64/boot/Image lava:/srv/tftp/rpi3-64-image ; scp arch/arm64/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb lava:/srv/tftp"
      lava: "scp arch/arm64/boot/Image root@lava:/srv/www/htdocs/artifacts/rpi3-64/rpi3-64-image{} ; scp arch/arm64/boot/dts/broadcom/bcm2837-rpi-3-b-plus.dtb root@lava:/srv/www/htdocs/artifacts/rpi3-64"
